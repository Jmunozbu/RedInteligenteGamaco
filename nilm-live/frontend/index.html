<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Clasificación en vivo – L1/L2</title>
  <style>
    :root{
      /* Paleta corporativa propuesta */
      --bg:#0E2335;        /* azul petróleo profundo (fondo) */
      --panel:#142E42;     /* panel/tarjeta */
      --border:#1E3C53;    /* bordes suaves */
      --text:#E7EEF4;      /* texto principal */
      --muted:#9EB3C6;     /* texto secundario */
      --accent:#E9A100;    /* dorado cálido (botones/barras) */
      --accent-2:#3DB7E4;  /* azul claro vibrante (detalles/hover) */
      --ok:#6BE69D; --warn:#F7D774; --bad:#E27373;
      --shadow:0 10px 24px rgba(0,0,0,.26);
      --radius:16px;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,Segoe UI,Roboto,Arial}
    a{color:inherit}
    header{border-bottom:1px solid var(--border);background:linear-gradient(0deg,transparent,rgba(255,255,255,.02));}
    .wrap{max-width:1100px;margin:0 auto;padding:20px 24px}

    /* Header */
    .head{display:flex;gap:14px;align-items:center;min-height:64px}
    .brand{display:flex;gap:14px;align-items:center}
    .brand img{height:42px;width:auto;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
    .title{font-weight:800;font-size:18px;letter-spacing:.2px}
    .subtitle{color:var(--muted);font-size:13px}

    /* Config */
    .cfg{
      background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
      padding:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0;box-shadow:var(--shadow)
    }
    input{
      padding:10px 12px;border-radius:10px;border:1px solid var(--border);
      background:#0C2235;color:var(--text);min-width:260px;outline:0;
    }
    input:focus{border-color:var(--accent-2);box-shadow:0 0 0 2px rgba(61,183,228,.25)}
    button{
      padding:10px 16px;border-radius:10px;border:1px solid #C08200;
      background:var(--accent);color:#1b1b1b;font-weight:800;cursor:pointer;
    }
    button:hover{box-shadow:0 0 0 2px rgba(61,183,228,.25)}
    .status{margin-left:10px;color:var(--muted)}

    /* Tarjetas */
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    @media (max-width:960px){.grid{grid-template-columns:1fr} input{min-width:unset;width:100%}}
    .card{
      background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;
      box-shadow:var(--shadow);position:relative;overflow:hidden;
    }
    .card:before{
      content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);opacity:.95;
    }
    .name{font-size:15px;font-weight:700;margin-bottom:6px;color:#D7E6F1}
    .class{font-size:30px;font-weight:900;letter-spacing:.2px}
    .meta{margin-top:6px;color:var(--muted);font-size:13px}
    code{color:#D7E6F1;background:#0C2235;padding:2px 6px;border-radius:6px;border:1px solid var(--border)}

    /* Pills */
    .pill{
      display:inline-block;padding:4px 10px;border-radius:999px;background:#0C2235;
      border:1px solid var(--border);font-weight:800;
    }
    .ok{color:var(--ok);border-color:#2C7A57}
    .warn{color:var(--warn);border-color:#9A7A20}
    .bad{color:var(--bad);border-color:#8C3A3A}

    /* Detalles */
    details{margin-top:18px}
    summary{cursor:pointer;color:var(--muted)}
    pre{
      background:#0C2235;border:1px solid var(--border);padding:12px;border-radius:10px;
      max-height:180px;overflow:auto;color:#CFE3F5
    }
    .brand img {
  height: 46px;
  width: auto;
  filter: brightness(0) invert(1) contrast(105%) saturate(0%)
          drop-shadow(0 2px 6px rgba(0,0,0,.35));
}
@media (max-width: 500px){
  .brand img { height: 40px; }
}
  </style>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
<header>
  <div class="wrap head">
    <div class="brand">
      <img src="assets/logogrupogamaco.png" alt="Logo Gamaco">
      <div>
        <div class="title">Clasificación en vivo – L1/L2</div>
        <div class="subtitle">Suscripción a <code>/pred/L1</code> y <code>/pred/L2</code></div>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="cfg">
    <input id="wsurl" placeholder="wss://<hivemq-host>:8884/mqtt" style="width:360px"
           value="wss://8c8fef4b1fe449129461c0141702e0cf.s1.eu.hivemq.cloud:8884/mqtt" />
    <input id="user" placeholder="user" value="BL441BW"/>
    <input id="pass" placeholder="pass" type="password" value="5Z6y4LR@$a"/>
    <input id="topicL1" placeholder="pred L1" value="sensors/adw220/dev01/pred/L1" />
    <input id="topicL2" placeholder="pred L2" value="sensors/adw220/dev01/pred/L2" />
    <button id="connectBtn">Conectar</button>
    <span id="statusText" class="status">Listo.</span>
  </div>

  <div class="grid">
    <div class="card">
      <div class="name">Línea L1</div>
      <div class="class" id="c1_class">—</div>
      <div class="meta">Confianza: <span id="c1_conf" class="pill">—</span></div>
      <div class="meta">Último dato: <span id="c1_time">—</span></div>
      <div class="meta">Topic: <code id="c1_topic">—</code></div>
    </div>
    <div class="card">
      <div class="name">Línea L2</div>
      <div class="class" id="c2_class">—</div>
      <div class="meta">Confianza: <span id="c2_conf" class="pill">—</span></div>
      <div class="meta">Último dato: <span id="c2_time">—</span></div>
      <div class="meta">Topic: <code id="c2_topic">—</code></div>
    </div>
  </div>

  <details>
    <summary>Diagnóstico</summary>
    <div class="card" style="margin-top:10px">
      <div class="name">Estado</div>
      <div class="meta">Broker WS: <span id="diagUrl">—</span></div>
      <div class="meta">Último evento: <span id="lastEvt">—</span></div>
      <div class="meta">Mensaje más reciente:</div>
      <pre id="rawBox">—</pre>
    </div>
  </details>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
  const $ = id => document.getElementById(id);
  const fmtTs = x => { const d=new Date(x); return isNaN(d)?'—':d.toLocaleString(); };

  function bindTile(idx, cls, conf, ts, topic){
    const c=$(`c${idx}_class`), p=$(`c${idx}_conf`), t=$(`c${idx}_time`), tp=$(`c${idx}_topic`);
    c.textContent = cls ?? '—';
    t.textContent = ts ? fmtTs(ts) : '—';
    if (tp) tp.textContent = topic || '—';
    p.classList.remove('ok','warn','bad');
    if (typeof conf === 'number' && !isNaN(conf)){
      const pct = Math.round(conf*100);
      p.textContent = pct+' %';
      if (pct>=80) p.classList.add('ok'); else if (pct>=50) p.classList.add('warn'); else p.classList.add('bad');
    } else { p.textContent='—'; }
  }
  function setStatus(s){ $('statusText').textContent = s; }
  function setDiag(msg){ $('rawBox').textContent = (msg||'').toString(); $('lastEvt').textContent = new Date().toLocaleTimeString(); }

  let client=null;
  $('connectBtn').addEventListener('click', () => {
    const url=$('wsurl').value.trim(), user=$('user').value.trim(), pass=$('pass').value;
    const tL1=$('topicL1').value.trim(), tL2=$('topicL2').value.trim();
    if (!url || !tL1 || !tL2){ alert('Configura WS URL y ambos tópicos.'); return; }
    $('diagUrl').textContent = url;
    try{ if(client) client.end(true) }catch(_){}

    client = mqtt.connect(url, {
      username: user || undefined,
      password: pass || undefined,
      keepalive:30, reconnectPeriod:2000, clean:true, connectTimeout:10000
    });

    client.on('connect', () => {
      setStatus('Conectado');
      client.subscribe([tL1,tL2], {qos:0}, (err)=>{
        if (err) setStatus('Error al suscribir');
        $('c1_topic').textContent = tL1; $('c2_topic').textContent = tL2;
      });
    });
    client.on('reconnect', ()=> setStatus('Reconectando…'));
    client.on('close',     ()=> setStatus('Cerrado'));
    client.on('error',     ()=> setStatus('Error'));

    client.on('message', (topic, payload) => {
      let js=null; try{ js=JSON.parse(payload.toString()) }catch(_){}
      setDiag(js ? JSON.stringify(js) : payload.toString());
      const ph  = js?.phase || (topic.endsWith('/L1')?'L1':(topic.endsWith('/L2')?'L2':null));
      const cls = js?.class ?? null;
      const cf  = typeof js?.confidence === 'number' ? js.confidence : null;
      const ts  = js?.ts ?? null;
      if (ph==='L1') bindTile(1, cls, cf, ts, topic);
      if (ph==='L2') bindTile(2, cls, cf, ts, topic);
    });
  });
});
</script>
</body>
</html>
